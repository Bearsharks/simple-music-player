name: Validate
on:
  push:
    branches: [master, 'refactor/**', 'design/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser persistence smoke
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/simple-music-player/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Design prototype preview
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/prototype.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node e2e/design-prototype.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: test-results/*.png
          retention-days: 7
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
# Deployment is deliberately separate: validation must never publish a PR.
