name: Validate
on:
  push:
    branches: [master, 'refactor/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser persistence smoke
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/simple-music-player/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
# Deployment is deliberately separate: validation must never publish a PR.
