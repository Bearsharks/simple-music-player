name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser persistence smoke
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/simple-music-player/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Custom domain root smoke
        run: |
          VITE_BASE_PATH=/ npm run build
          VITE_BASE_PATH=/ npx vite preview --host 127.0.0.1 --port 4175 > /tmp/vite-domain.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4175/ >/dev/null && break; sleep 1; done
          TEST_URL=http://127.0.0.1:4175/ node e2e/smoke.mjs
          TEST_URL=http://127.0.0.1:4175/ TEST_WIDTHS=390,1440 node e2e/typography.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          retention-days: 7
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
# Deployment is deliberately separate: validation must never publish a PR.
